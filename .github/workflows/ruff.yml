name: Ruff

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v4
        with:
          args: check .

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4
        with:
          args: format --check .